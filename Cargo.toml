[package]
name = "comet-minecraft"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Download and launch Minecraft: Java Edition effortlessly"
repository = "https://github.com/bllexz/comet"
keywords = ["minecraft", "downloader", "launcher"]

[lib]
name = "comet"

[features]
ts-types = ["dep:ts-rs"]

[dependencies]
taskee = { git = "https://github.com/bllexz/taskee", tag = "v0.1.0" }
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat"], optional = true }

tokio = { version = "1.53.1", default-features = false, features = ["macros", "process", "fs", "io-util"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
thiserror = "2.0.20"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
futures = { version = "0.3.34", default-features = false, features = ["std"] }
indexmap = { version = "2.14.2", default-features = false, features = ["std"] }
regex = { version = "1.13.1", default-features = false, features = ["std"] }
sha1 = { version = "0.11.0", default-features = false }

reqwest = { version = "0.13.5", features = ["stream"] }
zip = { version = "8.5.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

bon = "3.10.3"
url = "2.5.8"

[dev-dependencies]
tracing-subscriber = "0.3.23"
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt-multi-thread"] }
